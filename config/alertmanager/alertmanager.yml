global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: incidentpilot-webhook

receivers:
  - name: incidentpilot-webhook
    webhook_configs:
      - url: http://incidentpilot:8000/webhook/alert
        send_resolved: false
        http_config: {}
