name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # fastembed 0.2.7 declares <3.13 and python-dotenv 1.2.2 sets a >=3.10
      # floor, so the resolve only succeeds on 3.10 through 3.12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # every tool is pinned. an unpinned linter or test runner can turn CI red
      # on a tool release with no change to this code, so the versions here are
      # the ones the checks were validated against locally
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff==0.12.0 mypy==1.17.1

      # rule selection lives in ruff.toml, also to keep the surface deterministic
      - name: Ruff
        run: ruff check src scripts tests

      - name: Mypy
        run: mypy src scripts --ignore-missing-imports

      - name: Pytest
        run: pytest -q
